ze<button aria-label=\"Apri nota 37\" class=\"note-ref\" onclick=\"openNote(52,'37')\" type=\"button\">37</button>.</p>\n<p>I frutti della conoscenza sbocciano così in modo naturale, senza che ci sia il bisogno di forzature o imposizioni.</p>\n<p>La vera essenza dell'ispirazione, in definitiva, risiede nella sua capacità di risvegliare il desiderio innato di sapere e di scoprire.</p>\n<p>Questa prospettiva trasforma l'insegnamento in un atto di risonanza: un'energia che il docente trasmette non solo con le parole, ma con l'esempio, il tono della voce e la propria stessa presenza.</p>\n<p>Quando l’ispirazione, nutrita dalla bellezza, accesa dalla curiosità e sostenuta dalla motivazione, pervade un’aula, l’apprendimento smette di essere un percorso forzato. Diventa una danza armoniosa in cui ciascuno studente, sentendosi finalmente visto e accolto, partecipa secondo il proprio ritmo in un</p>\n", "images": []}}, {"type": "reading", "data": {"p": 53, "html": "\n<p>atto di fiducia.</p>\n<p>Questo approccio pedagogico è, nel suo cuore, una scommessa sulla fiducia: fiducia nel potenziale inespresso di ogni studente e nella nostra capacità, come docenti, di creare le condizioni perché possa finalmente sbocciare.</p>\n", "images": []}}, {"type": "reading", "data": {"p": 54, "html": "<h3 class=\"section-title\">Gioco bellezza e matematica</h3><p>Il gioco. Se doveste associare un’immagine alla parola gioco, voi quale scegliereste? L’ho chiesto a diverse colleghe, amici e conoscenti e, pur nella diversità delle risposte, che andavano da “mio figlio con il cellulare in mano”, alla “partita a calcetto del venerdì sera” a “un bimbo sull’altalena”, in tutte c’era un comune denominatore: un bambino assorbito in un’attività. Eh già, il bimbo che gioca lo fa in genere con un tal coinvolgimento che, se è ora di cena o di fare i compiti, puoi chiamarlo quanto vuoi, ma nei casi più fortunati al massimo si riceve una risposta del tipo “sì, un attimo e vengo“, senza specificare che quell’attimo promesso è sì un attimo, ma nel sistema di riferimento del bambino, e mai come in questo caso il concetto di relatività temporale assume sembianze concrete. Ma facciamo un passo indietro. Perché il bambino gioca? Beh, probabilmente gioca perché il gioco gli piace. E perché il gioco gli piace? Gli piace perché è bello. La bellezza del gioco non è un concetto astratto: è un’attrazione magnetica che spinge all’azione, un invito irresistibile a lasciarsi trasportare. Ed è proprio in questo</p>", "images": ["img_p54_1.jpeg"]}}, {"type": "reading", "data": {"p": 55, "html": "<p>abbandonarsi al gioco che si scivola nello stato di flow, quello stato di completa immersione in cui il tempo si dissolve e l’attenzione si focalizza in modo assoluto su ciò che si sta facendo. Si perde la concezione del tempo.</p><h3 class=\"section-title\">Il gioco come segreto dell’eterna giovinezza</h3><p>Già, perché, come recita una nota frase di discussa attribuzione<button aria-label=\"Apri nota 38\" class=\"note-ref\" onclick=\"openNote(55,'38')\" type=\"button\">38</button> “non smettiamo di giocare perché invecchiamo, ma invecchiamo perché smettiamo di giocare“. Lo sapeva bene la Dea Ebe, che nel gioco trovava l’elisir dell’eterna giovinezza. Giocare è un atto che rigenera, che ci mantiene vivi, curiosi, vibranti. Durante il gioco il tempo pare fermarsi, non esiste passato né futuro ma solo un interminabile momento presente. Giocare è una forma di meditazione in quanto si è consapevoli dell’istante che si sta vivendo. E volete sapere qual è il gioco più bello del mondo? Eggià, proprio la matematica, che “[..]Assorbe più degli scacchi, scommette più del poker, e dura più del Monopoli. È gratuita. E può essere giocata ovunque.[..]”(Richard J. Trudeau)<button aria-label=\"Apri nota 39\" class=\"note-ref\" onclick=\"openNote(55,'39')\" type=\"button\">39</button> Si dice spesso che per mantenere giovane la mente alle persone anziane venga consigliata la Settimana Enigmistica. Ma se ci pensiamo bene, cos’è la Settimana Enigmistica se non una raccolta di problemi e quesiti a sfondo logico-matematico? La matematica è il gioco per eccellenza, capace di accendere la curiosità e trascinare chiunque nella sua rete fatta di logica, creatività e bellezza.</p><h3 class=\"section-title\">Quando un quesito matematico può definirsi un gioco?</h3><p>Un problema matematico diventa gioco quando è accessibile a tutti, non richiede competenze avanzate e viene formulato in maniera simpatica, poetica o enigmatica. Ancora meglio se è immerso in un contesto fiabesco o paradossale. Spesso, la vera</p>", "images": []}}, {"type": "reading", "data": {"p": 56, "html": "<p>bellezza del gioco matematico si rivela nella sua soluzione: quando è geniale, quando è sorprendentemente semplice ma potente, quando è fantasiosa ma efficace. Qualche giorno fa ho chiesto ai miei studenti: “Se doveste ricordare un PIN di quattro cifre, quanti tentativi al massimo dovreste fare per trovarlo, sapendo che le cifre si possono ripetere?” I più preparati hanno subito capito che si trattava di un problema di disposizioni con ripetizione e hanno applicato la relativa formula: 10<sup>4</sup>. Ma la risposta più bella è arrivata da uno studente che, di solito, durante le lezioni di matematica si estranea completamente, nella convinzione di non capirci nulla: “Qualsiasi numero che ha al massimo quattro cifre, quindi 10.000 tentativi, da 0000 a 9999.“ Ecco che un problema di matematica diventa un gioco. Ecco che la bellezza della matematica si manifesta nell’eleganza della soluzione. Perché il vero gioco è quello che ci sorprende, che ci fa esclamare “Wow!”, “Eureka!“, che ci fa perdere la concezione del tempo e ci immerge in un’esperienza di pura bellezza. Ed è proprio lì, in quel momento sospeso, che si trova il segreto della matematica: un gioco senza fine, che non smette mai di stupire e di emozionare. Abbiamo già esplorato il legame tra bellezza, emozione e apprendimento e questo può creare consapevolezza dell’importanza di integrare il gioco nella didattica.</p><h3 class=\"section-title\">Dalla bellezza alla sfida: le tre dimensioni del gioco</h3><p>La prima dimensione del gioco, di qualunque gioco, è pertanto la bellezza. Successivamente subentrano altri due fattori, che anticipo ma che esplorerò nel paragrafo successivo: dopo un po’ che il bambino gioca, si accorge che le sue abilità migliorano e diventa sempre più bravo, veloce e reattivo. Subentra pertanto il piacere di migliorare che porta con sé la gratificazione concreta di un risultato o di un livello migliore di quelli raggiunti in precedenza: questa è la gamification.</p>", "images": []}}, {"type": "reading", "data": {"p": 57, "html": "<p>Tuttavia questa gratificazione per il proprio miglioramento personale può venire disturbata qualora ci si accorga che il nostro amico, compagno, fratello … ha raggiunto nello stesso gioco risultati migliori dei nostri. Ecco che subentra pertanto il confronto, la competizione e il desiderio di non essere da meno: “se lo ha fatto lui, posso farlo anche io. Anzi posso fare meglio io.” È questa la terza dimensione del gioco: la gara.</p>", "images": []}}, {"type": "reading", "data": {"p": 58, "html": "<h3 class=\"section-title\">Gamification e motivazione</h3><p>La gamification – o gamificazione – consiste nell’introdurre meccanismi tipici del gioco in contesti non ludici per stimolare partecipazione, impegno e motivazione. Elementi come livelli, punti, premi e ricompense possono trasformare una semplice attività didattica in una sfida emozionante, rendendo l’apprendimento più coinvolgente. Questo approccio sfrutta un tratto universale dell’essere umano: il desiderio di migliorarsi e il piacere di sentirsi ricompensati per i propri sforzi. Pensate a una situazione quotidiana: iniziate a fare una passeggiata per perdere qualche chilo, senza obiettivi particolari, ma un giorno vi accorgete che il solito giro di 5 km vi richiede solo 55 minuti, invece dell’ora che impiegavate all’inizio. È una piacevole sorpresa, che diventa lo stimolo per migliorare ancora. D’improvviso, non camminate più solo per perdere peso: volete battere il vostro record. Comprate uno smartwatch, scarpe migliori, e cercate di abbassare il tempo, giro dopo giro, passando da 55 minuti a 54, poi 53, in un ciclo continuo di sfida con voi stessi. Cosa ha scatenato questa trasformazione? La vera magia della gamification non risiede tanto nei premi esterni, quanto nella sua capacità di costruire una ricompensa interna e duratura: il senso di autoefficacia. Come ci insegna</p>", "images": ["img_p58_1.jpeg"]}}, {"type": "reading", "data": {"p": 59, "html": "<p>Albert Bandura<button aria-label=\"Apri nota 40\" class=\"note-ref\" onclick=\"openNote(59,'40')\" type=\"button\">40</button>, la convinzione nelle proprie capacità è il motore più potente della motivazione. Una gamification ben progettata non si limita a distribuire punti, ma costruisce un’architettura di esperienze che permette allo studente di percepirsi competente e artefice del proprio successo. Perché questo avvenga, le meccaniche di gioco devono essere orientate a nutrire la fiducia dello studente, non solo a misurare la sua performance. Ciò significa:</p><ul><li>Obiettivi prossimali e progressivi: Suddividere un compito complesso in sotto-obiettivi chiari e raggiungibili (livelli, missioni) permette allo studente di sperimentarne la \"padronanza\". Ogni piccolo successo diventa una prova concreta di competenza, che alimenta la voglia di affrontare la sfida successiva.</li><li>Feedback informativo, non solo giudicante: Un punteggio è un giudizio; un feedback che dice \"Hai superato questo livello perché hai usato la strategia X\" è informazione. Le meccaniche di gioco più evolute dovrebbero premiare non solo il risultato, ma anche il processo: l'uso di una strategia efficace, la correzione di un errore, la perseveranza. Questo sposta l'attribuzione del successo da un generico \"sono bravo\" a un più potente \"ci sono riuscito perché ho fatto così\".</li><li>Standard di prestazione chiari: Sapere esattamente cosa serve per \"vincere\" o passare al livello successivo riduce l'ansia e permette allo studente di autoregolare il proprio sforzo, trasformandolo da esecutore passivo a giocatore strategico. Ciò implica che l’attività debba essere ben calibrata: un sistema che non offre miglioramenti percepibili – come una passeggiata che diventa sempre più faticosa e lenta</li></ul>", "images": []}}, {"type": "reading", "data": {"p": 60, "html": "<p>– porta alla demotivazione e all’abbandono. Per questo, il ruolo dell’insegnante è fondamentale nel costruire attività in grado di bilanciare sfida e ricompensa, evitando di creare situazioni frustranti o troppo facili. Quando le meccaniche di gioco sono progettate in questo modo, la gratificazione non dipende più solo dal premio finale, ma nasce dal processo stesso e dal vedersi migliorare. È questo che trasforma un interesse passeggero in una motivazione intrinseca e resiliente, un compito che altrimenti potrebbe sembrare monotono in un’esperienza stimolante. A differenza del voto tradizionale, spesso percepito dagli studenti come un giudizio definitivo, un sistema di gioco ben progettato per l'autoefficacia crea uno spazio sicuro per sperimentare, sbagliare e migliorare. Grazie a piattaforme online come Kahoot, Wayground o PanQuiz, il risultato diventa un feedback immediato e privato, capace di fornire uno stimolo continuo senza la pressione sociale del confronto.</p><h3 class=\"section-title\">Meccanismi di ricompensa e l’importanza della gratificazione</h3><p>L’approccio della gamification si basa su meccanismi di ricompensa e gratificazione immediata ben studiati in diversi contesti: questo approccio ricalca, per esempio, quello che viene chiamato “rinforzo positivo”<button aria-label=\"Apri nota 41\" class=\"note-ref\" onclick=\"openNote(60,'41')\" type=\"button\">41</button>, un concetto con radici profonde nella psicologia del comportamento. Un cane, per esempio, impara rapidamente ad associare un determinato comportamento a una ricompensa: se esegue un comando, riceve un boccone di</p>", "images": []}}, {"type": "reading", "data": {"p": 61, "html": "<p>cibo. Allo stesso modo, uno studente sarà spinto a ripetere un’attività se si sente gratificato dal risultato ottenuto.</p><h3 class=\"section-title\">Trasformare un esercizio di equazioni in una sfida</h3><p>Un principio consolidato della psicologia dell'apprendimento suggerisce che un concetto viene veramente interiorizzato solo quando lo si è applicato con successo in molteplici contesti<button aria-label=\"Apri nota 42\" class=\"note-ref\" onclick=\"openNote(61,'42')\" type=\"button\">42</button>, per esempio in almeno cinque situazioni diverse. Quindi l’idea è cercare 5 contesti diversi per creare le 5 situazioni, inserire quest’ultime in accattivanti app per la didattica<button aria-label=\"Apri nota 43\" class=\"note-ref\" onclick=\"openNote(61,'43')\" type=\"button\">43</button> come quelle sopra citate e lasciare che lo studente…giochi! Questi livelli possono essere implementati in piattaforme come quelle già menzionate, ma anche in semplici moduli Google. L’obiettivo è rendere ogni passo del percorso stimolante, creando una progressione che catturi l’attenzione e rafforzi l’apprendimento. La gamification, in definitiva, non è solo un metodo per rendere le lezioni più interessanti. È uno strumento che sfrutta le dinamiche del gioco per reintrodurre il piacere dell’apprendimento, trasformando anche i compiti più impegnativi in opportunità per crescere, sbagliare e migliorare.</p>", "images": []}}, {"type": "video", "data": {"after": 61, "title": "Video 4 · Dal gioco alla motivazione", "duration": "1–2 minuti", "script": "Gamificare non significa semplicemente distribuire punti e premi. Una buona esperienza di gioco rende visibile il progresso e permette allo studente di percepirsi competente. Per questo funzionano obiettivi vicini e raggiungibili, livelli progressivi, feedback che spiegano che cosa ha funzionato e criteri chiari per avanzare. La sfida deve essere abbastanza difficile da coinvolgere, ma non così difficile da generare rinuncia. Quando il gioco sostiene l’autoefficacia, la ricompensa più importante non è il premio esterno, ma il sentirsi capaci di migliorare. È questa la vera forza didattica della gamification: trasformare l’impegno in esperienza significativa.", "images": ["Percorso a livelli come scala con piccoli traguardi raggiungibili e studente che avanza con fiducia, metafora dell’autoefficacia, 16:9.", "Interfaccia astratta di gioco didattico con livelli, progresso e feedback positivo, nessun marchio, 16:9.", "Studente concentrato su una sfida matematica simile a un puzzle, coinvolgimento e soddisfazione, aula moderna, 16:9."], "video": "video4.mp4"}}, {"type": "checkpoint", "data": {"title": "Checkpoint · Gioco e motivazione", "qs": [["Nel testo, bellezza e curiosità vengono presentate come:", ["Leve dell’apprendimento", "Distrazioni", "Alternative ai contenuti", "Forme di valutazione"], 0], ["Nel testo, il gioco è collegato allo stato di flow perché:", ["Può produrre immersione profonda e perdita della percezione del tempo", "Rende ogni attività facile", "Elimina sempre l’errore", "Richiede necessariamente competizione"], 0], ["Secondo il capitolo, una buona gamification dovrebbe sostenere:", ["Il senso di autoefficacia", "La dipendenza dal premio esterno", "La paura di fallire", "L’ambiguità degli obiettivi"], 0]]}}, {"type": "final"}];

const sourceNotes={"20:5": "Immordino-Yang, M. H., & Damasio, A. (2007). We feel, therefore we learn: The relevance of affective and social neuroscience to education. Mind, Brain, and Education, 1(1), 3–10", "20:6": "L'apprendimento non è un processo isolato o puramente cognitivo, ma immerso in un contesto psicofisiologico dinamico che può favorire o ostacolare l'acquisizione di conoscenze (Jensen, E. (2013). Engaging students with poverty in mind: Practical strategies for raising achievement. ASCD.)", "20:7": "Inteso qui come metafora per descrivere l’interazione dinamica degli stati emotivi.", "20:8": "Becker, E. S., Götz, T., Morger, V., & Ranellucci, J. (2014). The importance of teachers' emotions and instructional behavior for their students' emotions – An experience sampling analysis. Teaching and Teacher Education, 43, 15–26.", "21:9": "Secondo Antonio Damasio, le emozioni non sono sentimenti privati, ma un “insieme di risposte [...] osservabili pubblicamente” che producono una “modificazione dello stato del corpo” (Damasio, 1999, p. 54). Un'emozione, quindi, è prima di tutto un'azione, un movimento.", "22:10": "Kaptchuk, TJ (2000). La rete che non ha tessitore: comprendere la medicina cinese. Congdon & Weed", "22:11": "Ciò significa che i contenuti appresi in condizioni di disagio emotivo possono essere interiorizzati con una connotazione negativa, complicando il successivo richiamo e utilizzazione delle conoscenze (Tyng, C.M., Amin, H.U., Saad M.N.M. and Malik A.S. (2017). The Influences of Emotion on Learning and Memory.Front. Psychol.8:1454)", "23:12": "Lucas-Oliva, I.,Toledo-Vega, B, F. Núñez-Román, (2022), From neurodidactics to language teaching and learning: The emotional approach. Theory and Practice in Language Studies, 12(8) 1457-1467.", "26:14": "Johnstone, K. (1999). Impro: Improvisation and the theatre. Routledge.", "27:15": "https://www.thomasedison.org/edison-quotes.", "27:16": "Domanda sul barometro. Wikipedia. 5 gennaio 2024. Disponibile all'indirizzo: https://en.wikipedia.org/wiki/Barometer_question.", "28:17": "Studio-psyche.it, “Kintsugi filosofia orientale, una metafora della psicoterapia”, https://studio-psyche.it/kintsugi-filosofia-orientale, consultato il 11/11/2025.", "29:18": "Immordino-Yang, M. H., & Damasio, A. (2007). We Feel, Therefore We Learn: The Relevance of Affective and Social Neuroscience to Education. Mind, Brain, and Education, 1(1), 3–10. https://doi.org/10.1111/j.1751-228X.2007.00004.x", "30:19": "L’anonimato e la partecipazione volontaria favoriscono un feedback spontaneo. A tutela della privacy inoltre è fondamentale che i dati non vengono archiviati, analizzati automaticamente né associati all’identità dello studente.", "30:20": "Il termine misurare, in questo contesto, non indica una misurazione clinica, fisica o biometrica, ma si riferisce metaforicamente all'atto di osservazione pedagogica sull'autopercezione dichiarata dagli studenti.", "31:21": "Tra le competenze del docente abilitato definite dal DPCM 4/8/2023, Allegato A, compare espressamente \"Competenze di regolazione del proprio agire professionale: “saper leggere la situazione, prevederne e misurarne gli scostamenti rispetto a quanto atteso o progettato per intervenire con efficacia”.", "32:22": "Per un elenco dettagliato di tecniche di respirazione, brani musicali e tracce specifiche testate in classe, con relativi esempi strutturati, si rimanda alla parte III e relative appendici di questo volume.", "33:23": "Si veda, in senso motivazionale e filosofico, Wattles, Wallace Delois. La scienza del diventare ricchi, Feltrinelli Editore, (2024)", "35:24": "https://www.complexityeducation.com/2019/02/25/fenomeni-emergenti/ consultato in data 11/11/2025", "35:25": "Il fenomeno dell’entanglement è usato qui come metafora di interdipendenza, senza implicare trasmissione di informazione.", "38:26": "https://medtrics.org/mirror-neurons-the-brains-mechanism-for-empathy-and-imitation/", "39:27": "Lo stesso esercizio è suggerito per il docente che desidera sviluppare le proprie competenze empatiche. Riyadi, A. R., Maulida, A. S., Ginting, L. C. B., Sa’ud, U. S., Dwidianti, K., Al Gifari, M. R., Sholihat, N. P., Riyadi, D., & Ridhlah, N. L. (2025). Memahami mekanisme berpikir melalui neuro-linguistic programming untuk memperkuat deep learning di sekolah dasar. AL-KHIDMAH: Jurnal Pengabdian Masyarakat, 5(2), 92-104. https://doi.org/10.55210/khidmah.v5i2.607", "40:28": "Il metodo permette anche di superare l'atmosfera eccessivamente competitiva della scuola tradizionale, creando tra gli studenti interdipendenza forzata che li spinge a vedersi come risorse reciprocamente preziose piuttosto che come rivali. Jigsaw groups and the desegregated classroom: In pursuit of common goals. Personality and Social Psychology Bulletin, 5(4), 438–446.", "43:29": "Bono, G., Mangan, S., Fauteux, M., & Sender, J. (2020). A new approach to gratitude interventions in high schools that supports student wellbeing. The Journal of Positive Psychology.", "45:30": "Si veda anche il paragrafo “Il ragazzo che vide la matematica”, \"Didattica Vibrazionale: in risonanza con l'armonia\" (Bartoli, 2024),", "46:31": "Indicazione tratta dal corso per docenti: inclusione scolastica e buone prassi, 16/01/2025, https://www.youtube.com/watch?v=zMKssXzLbH8&t=1142s", "49:32": "Viereck, G. S. (1929, October 26). What life means to Einstein. The Saturday Evening Post, 17, pag. 115.", "51:33": "Bottalo, F., & Brotzu, R. (1999). Fondamenti di medicina tradizionale cinese. Xenia.", "51:34": "Sull’educazione in Pedagogia e didattica di Albert Einstein (1936) da “PENSIERI DEGLI ANNI DIFFICILI”, https://liberascuola-rudolfsteiner.it/2017/12/30/sulleducazione/.", "51:35": "Platone. Teeteto.", "51:36": "Adattamento di un concetto espresso in: Saint-Exupéry, A. de. (1948). Cittadella (Cittadella).", "52:37": "Montessori, M. (1952). La scoperta del bambino. Garzanti.", "55:38": "L'aforisma è comunemente attribuito a George Bernard Shaw, ma non vi è traccia nei suoi scritti. Per un'analisi dettagliata, si veda l'approfondimento del sito Quote Investigator, https://quoteinvestigator.com/2024/03/09/play-grow/", "55:39": "Trudeau, RJ (1976). Punti e linee. Kent State University Press.", "59:40": "L’applicazione dei principi dell’autoefficacia alla progettazione di meccaniche motivazionali è approfondita da Bandura. I concetti qui rielaborati – come l'importanza degli obiettivi prossimali, del feedback informativo e degli standard di prestazione – si basano sulle sue tesi. Cfr. Bandura, A. (2000). Autoefficacia: teoria e applicazioni. Erickson, Trento, in particolare pp. 303-313 e 331-333.", "60:41": "Il concetto di rinforzo positivo, originariamente sviluppato in ambito comportamentista (Skinner, 1938), trova oggi solide conferme nelle neuroscienze. Studi di imaging cerebrale dimostrano che le pratiche di rinforzo positivo attivano il sistema di ricompensa del cervello (legato al rilascio di dopamina) e possono ridurre l'impatto neurale delle interferenze emotive, migliorando così la motivazione e le prestazioni cognitive. Si veda, ad esempio, Ladouceur, C.D, et al. (2017), \" Positive reinforcement modulates fronto-limbic systems subserving emotional interference in adolescents”.", "61:42": "Questo approccio si fonda sul principio della 'variabilità della pratica' (Bjork & Bjork, 2020), secondo cui l'applicazione di una competenza in contesti differenti e imprevedibili, pur rallentando l'esecuzione iniziale, è l'unico modo per garantire un apprendimento profondo e trasferibile (Gick & Holyoak, 1983). Tuttavia, per un'analisi dei limiti di tale pratica, si veda Caballero et al. (2024), il quale avverte che un eccesso di variabilità può risultare controproducente se non calibrato sulle capacità individuali del discente e sulla natura del compito.", "61:43": "Nota di cautela: Prima di invitare gli studenti a utilizzare app o piattaforme esterne, è indispensabile verificare che queste siano conformi al GDPR e al regolamento digitale d'Istituto. In particolare, accertarsi che non richiedano la creazione di account personali non autorizzati, non profilino i dati dei minori a fini commerciali e rispettino i limiti di età previsti dai Termini di Servizio. Ove non possibile, privilegiare l'uso dimostrativo alla LIM o account anonimi gestiti dal docente.", "25:13": "Hattie, J., & Timperley, H. (2007). The power of feedback. Review of Educational Research, 77(1), 81–112."};

function saveCertificateName(value){certificateName=value;localStorage.setItem('sel_certificate_name',value);const printed=document.querySelector('.certificate-name-print');if(printed)printed.textContent=value}
function finalHTML(){let s=quizState.final||{i:0,score:0};quizState.final=s;if(s.finished)return `<div class="kicker">Test finale concluso</div><h2>${s.score}/40</h2>`+(s.score>=32?`<div class="certificate"><h2>Attestato di completamento</h2><p>Si certifica che</p><p><input id="certificateName" aria-label="Nome e cognome" autocomplete="name" placeholder="Nome e cognome" value="${escapeAttribute(certificateName)}" oninput="saveCertificateName(this.value)"><span class="certificate-name-print">${escapeAttribute(certificateName)}</span></p><p>ha completato con profitto <strong>In classe con le competenze socio-emotive · Modulo 1</strong></p><p><strong>10 ore di formazione professionale</strong></p><button class="btn no-print" onclick="window.print()">Stampa / salva PDF</button></div>`:`<div class="feedback bad">Soglia non raggiunta: servono almeno 32/40.</div><button class="btn" onclick="resetFinal()">Riprova</button>`);let q=finalQs[s.i];return `<div class="kicker">Test finale · 40 domande</div><h2>Verifica conclusiva</h2><div class="quizShell"><div class="quizTop">Domanda ${s.i+1} di 40 · soglia 32/40</div><div class="miniProgress"><i style="width:${((s.i+1)/40)*100}%"></i></div><div class="qbox"><h3>${q[0]}</h3><div class="opts">${q[1].map((o,oi)=>`<label class="opt"><input type="radio" name="finalq" value="${oi}"> ${o}</label>`).join('')}</div></div><div class="quizNav"><span></span><button class="btn" onclick="answerFinal()">${s.i===39?'Concludi test':'Rispondi e continua'}</button></div></div>`}
function videoHTML(d,ui){return `<div class="kicker">${d.duration}</div><h2>${d.title}</h2><div class="video-frame"><video controls playsinline preload="none" aria-label="${d.title}" src="${d.video}">Il browser non supporta la riproduzione video.</video></div><p class="no-print"><button class="btn secondary" onclick="showNotes(${ui})">Testo e immagini suggerite</button></p><div id="vn${ui}"></div>`}
function pageHTML(u,side,ui){if(!u)return `<section class="page ${side}"></section>`;if(u.type==='cover')return `<section class="page ${side} cover"><img src="copertina_libro.png" alt="Copertina"></section>`;if(u.type==='text')return `<section class="page ${side}"><div class="kicker">${u.data.kicker}</div><h2>${u.data.title}</h2>${bodyHTML(u.data.body)}</section>`;if(u.type==='reading')return `<section class="page ${side}">${readingHTML(u.data)}</section>`;if(u.type==='tree')return `<section class="page ${side}">${treeHTML()}</section>`;if(u.type==='checkpoint')return `<section class="page ${side}">${checkpointHTML(u.data,ui)}</section>`;if(u.type==='video')return `<section class="page ${side}">${videoHTML(u.data,ui)}</section>`;return `<section class="page ${side}">${finalHTML()}</section>`}
function render(){let mobile=matchMedia('(max-width:900px)').matches,sp=document.getElementById('spread');if(mobile)sp.innerHTML=`<section class="page left"></section>`+pageHTML(units[pos],'right',pos);else{let l=pos%2===0?pos:pos-1;sp.innerHTML=pageHTML(units[l],'left',l)+pageHTML(units[l+1],'right',l+1)}document.getElementById('bar').style.width=((pos+1)/units.length*100)+'%';document.getElementById('counter').textContent=`${pos+1} / ${units.length}`;localStorage.setItem('sel_mod1_pos',pos);toc()}
function toc(){let t=document.getElementById('toc');t.innerHTML='';[['Inizio',0],['Competenze e normativa',1],['Modelli internazionali',6],['Letture',14],['Test finale',units.length-1]].forEach(([n,i])=>{let b=document.createElement('button');b.textContent=n;if(Math.abs(pos-i)<3)b.className='active';b.onclick=()=>{pos=i;render()};t.appendChild(b)})}
function step(d){let n=Math.max(0,Math.min(units.length-1,pos+d));if(n!==pos){pos=n;render()}}
document.getElementById('next').onclick=()=>step(matchMedia('(max-width:900px)').matches?1:2);document.getElementById('prev').onclick=()=>step(matchMedia('(max-width:900px)').matches?-1:-2);let sx=0,sy=0,swipeActive=false;stage.addEventListener('pointerdown',e=>{swipeActive=!e.target.closest('button,input,label,textarea,select,video,a');if(!swipeActive)return;sx=e.clientX;sy=e.clientY});stage.addEventListener('pointerup',e=>{if(!swipeActive)return;swipeActive=false;let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3)step(dx<0?(matchMedia('(max-width:900px)').matches?1:2):(matchMedia('(max-width:900px)').matches?-1:-2))});
function answerCP(ui){const s=quizState[ui],e=document.querySelector(`input[name="cp${ui}"]:checked`);if(!s||s.finished||!e)return;if(+e.value===s.qs[s.i][2])s.score++;if(s.i<s.qs.length-1)s.i++;else s.finished=true;render()}
function resetCP(ui){quizState[ui]=newCheckpoint(units[ui].data);render()}
function answerFinal(){let s=quizState.final||{i:0,score:0},e=document.querySelector('input[name="finalq"]:checked');if(!e)return;if(+e.value===finalQs[s.i][2])s.score++;if(s.i<39){s.i++;quizState.final=s;render()}else{s.finished=true;quizState.final=s;render()}}
function resetFinal(){quizState.final={i:0,score:0};sessionStorage.removeItem('sel_final40');finalQs=shuffle(finalSource).map(q=>{let c=q[1][q[2]],o=shuffle(q[1]);return[q[0],o,o.indexOf(c)]});sessionStorage.setItem('sel_final40',JSON.stringify(finalQs));render()}
function showNotes(ui){let d=units[ui].data;document.getElementById('vn'+ui).innerHTML=`<div class="feedback ok"><strong>Testo voce</strong><p>${d.script}</p><strong>Immagini suggerite</strong><ol>${d.images.map(x=>`<li>${x}</li>`).join('')}</ol></div>`}
let noteOpener=null;
function showModal(title,text){
 noteOpener=document.activeElement;
 document.getElementById('modalTitle').textContent=title;
 document.getElementById('modalText').textContent=text;
 document.getElementById('noteBack').classList.add('show');
 document.querySelector('.app').inert=true;
 document.body.classList.add('note-open');
 document.getElementById('modalText').scrollTop=0;
 document.querySelector('.closeX').focus();
}
function closeModal(){
 document.getElementById('noteBack').classList.remove('show');
 document.querySelector('.app').inert=false;
 document.body.classList.remove('note-open');
 if(noteOpener?.isConnected)noteOpener.focus({preventScroll:true});
}
function openNote(page,n){let txt=sourceNotes[`${page}:${n}`]||'Nota non disponibile.';showModal(`Nota ${n}`,txt)}
function openConceptNote(){showModal('Nota sul modello pedagogico','In questo percorso l’espressione indica un modello pedagogico olistico che considera apprendimento, emozioni, relazioni, corpo e contesto come dimensioni interdipendenti dell’esperienza scolastica. Il termine non indica una teoria fisica delle “vibrazioni”, ma una metafora educativa riferita al clima e alla risonanza emotiva dell’aula.')}
document.getElementById('noteBack').addEventListener('click',e=>{if(e.target.id==='noteBack')closeModal()});
addEventListener('keydown',e=>{if(document.getElementById('noteBack').classList.contains('show')){if(e.key==='Escape')closeModal();if(e.key==='Tab'){e.preventDefault();document.querySelector('.closeX').focus()}return;}if(e.target.closest('input,textarea,select'))return;if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});matchMedia('(max-width:900px)').addEventListener('change',render);render();
</script></body></html>
